name: Active map pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pinned Caddy with release checksum
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/caddy.tar.gz"
          echo "727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b  $RUNNER_TEMP/caddy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm run check
      - run: npm test
      - run: npm run test:architecture
      - run: npm run build
      - run: npm run demo:prepare
      - run: npm run test:hosting
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Preserve browser proof
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-proof
          path: test-results/browser/
          if-no-files-found: warn
          retention-days: 14
