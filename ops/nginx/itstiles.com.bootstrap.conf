# itstiles.com - bootstrap site, before the certificate exists (port 80 only).
#
# Installed as /etc/nginx/sites-available/itstiles.com (symlinked from sites-enabled/itstiles.com) only
# while /etc/letsencrypt/live/itstiles.com/fullchain.pem does not exist. It answers the HTTP-01
# challenge for `certbot certonly --webroot -w /var/www/letsencrypt -d itstiles.com -d www.itstiles.com`
# and 404s everything else: no map is served over plain HTTP. Then replace this file, at the same path,
# with itstiles.com.conf. Never enable both: they declare the same names on :80.
# Needs nothing else from ops/nginx/. No `default_server`, no `reuseport`.
# Rollback: rm /etc/nginx/sites-enabled/itstiles.com && nginx -t && systemctl reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name itstiles.com www.itstiles.com;
    access_log /var/log/nginx/itstiles.access.log combined buffer=64k flush=1m;
    error_log  /var/log/nginx/itstiles.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
