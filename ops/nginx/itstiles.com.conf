# itstiles.com - TSTiles static PMTiles host on the shared nginx, after the certificate exists.
#
# Installed as /etc/nginx/sites-available/itstiles.com (symlinked from sites-enabled/itstiles.com),
# replacing itstiles.com.bootstrap.conf at the same path once
# /etc/letsencrypt/live/itstiles.com/fullchain.pem exists. Never enable both: they declare the same
# names on :80. Needs, in /etc/nginx/snippets/: tstiles-http.conf, tstiles-routes.conf,
# tstiles-cloudflare-realip.conf (all from ops/nginx/ in the TSTiles repository).
# Certificate: `certbot certonly --webroot -w /var/www/letsencrypt -d itstiles.com -d www.itstiles.com`,
# never `--nginx`: certbot owns /etc/letsencrypt only; this repository owns the site file.
# Content: /mnt/tstiles/site (the dedicated volume), readable by www-data. Static file changes need no reload.
#
# No `default_server` (000-catchall owns that), no `reuseport` (another site claims it on :443).
# Rollback: rm /etc/nginx/sites-enabled/itstiles.com && nginx -t && systemctl reload nginx.

# http context (sites-enabled is included inside http {}): the $tstiles_* maps. Exactly once per nginx.
include /etc/nginx/snippets/tstiles-http.conf;

server {
    listen 80;
    listen [::]:80;
    server_name itstiles.com www.itstiles.com;
    include /etc/nginx/snippets/tstiles-cloudflare-realip.conf;
    access_log /var/log/nginx/itstiles.access.log combined buffer=64k flush=1m;
    error_log  /var/log/nginx/itstiles.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://itstiles.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.itstiles.com;
    include /etc/nginx/snippets/tstiles-cloudflare-realip.conf;

    ssl_certificate     /etc/letsencrypt/live/itstiles.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itstiles.com/privkey.pem;

    access_log /var/log/nginx/itstiles.access.log combined buffer=64k flush=1m;
    error_log  /var/log/nginx/itstiles.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://itstiles.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name itstiles.com;
    include /etc/nginx/snippets/tstiles-cloudflare-realip.conf;

    ssl_certificate     /etc/letsencrypt/live/itstiles.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itstiles.com/privkey.pem;

    # Successful archive reads (200/206/304) are not logged: each map view makes dozens of Range
    # requests and the root disk is shared. Everything else, including archive errors, is.
    access_log /var/log/nginx/itstiles.access.log combined buffer=64k flush=1m if=$tstiles_loggable;
    error_log  /var/log/nginx/itstiles.error.log warn;

    # Requests have no body worth reading: everything but GET/HEAD/OPTIONS is 405.
    client_max_body_size 16k;

    # brotli (and brotli_static) are on http-wide on this host. PMTiles and glyph bytes must not be
    # re-encoded, and the routes snippet cannot name this third-party module, so it is off for the
    # whole site; gzip still compresses JSON/JS/CSS and is off per-location for archives and .pbf.
    brotli off;
    brotli_static off;

    root /mnt/tstiles/site;
    include /etc/nginx/snippets/tstiles-routes.conf;
}
