# TSTiles nginx: http-context variables used by tstiles-routes.conf and itstiles.com.conf.
#
# Installed as /etc/nginx/snippets/tstiles-http.conf and included ONCE, at the top level of the site
# file (sites-enabled files are read in http context). Every name starts with $tstiles_, so nothing
# here changes another site. Including it twice on one nginx is a "duplicate variable" error.
# Rollback: it goes away with the site file (remove the sites-enabled symlink, `nginx -t`, reload).
#
# Why maps at all: nginx's add_header does not merge across levels and cannot depend on the final
# status without a variable. Two nginx behaviours make naive `add_header ... always` wrong here:
#
# 1. A 416 (unsatisfiable Range) runs the header filters twice: first while the status is still 200
#    (the range filter runs after the headers filter), then again for the 416 error page, keeping the
#    first pass's headers. Plain `always` headers would be sent twice, and
#    "Access-Control-Allow-Origin: *, *" is rejected by browsers. Only the range filter produces a 416
#    here, so the CORS/nosniff/HSTS values below are empty - add_header skips empty values - when the
#    status is 416: the first pass already added them. (A $sent_http_* guard does not work: nginx
#    caches that variable from the first pass.)
# 2. Error responses must carry Cache-Control: no-store while successful ones carry the route's policy.
#    $tstiles_error_no_store is non-empty only for 4xx/5xx. The route policy itself is a plain
#    (non-always) add_header, which nginx applies to 200/201/204/206/301-304/307/308 only.
#    Consequence of (1): a 416 carries the first pass's route policy AND "no-store". no-store governs
#    (RFC 9111 5.2.2.5), but the header is not byte-identical to Caddy's single "no-store".
#
# `volatile` makes nginx re-evaluate the map on each use (both header passes) instead of caching it.

map $status $tstiles_acao {
    volatile;
    416     "";
    default "*";
}
map $status $tstiles_acam {
    volatile;
    416     "";
    default "GET, HEAD, OPTIONS";
}
map $status $tstiles_acah {
    volatile;
    416     "";
    default "Range, If-Match, If-None-Match, If-Modified-Since";
}
map $status $tstiles_aceh {
    volatile;
    416     "";
    default "Accept-Ranges, Content-Length, Content-Range, ETag, Last-Modified";
}
map $status $tstiles_nosniff {
    volatile;
    416     "";
    default "nosniff";
}
# HSTS only over HTTPS (RFC 6797 forbids it on plain HTTP); no includeSubDomains, no preload.
map "$scheme:$status" $tstiles_hsts {
    volatile;
    "https:416" "";
    "~^https:"  "max-age=31536000";
    default     "";
}

map $status $tstiles_error_no_store {
    volatile;
    "~^[45]" "no-store";
    default  "";
}
map $status $tstiles_allow {
    volatile;
    405     "GET, HEAD, OPTIONS";
    default "";
}
map "$request_method:$status" $tstiles_max_age {
    volatile;
    "OPTIONS:204" "3600";
    default       "";
}

# Access-log filter for itstiles.com.conf: successful archive reads (200/206/304) are not logged.
# A map view issues dozens of small Range requests; logging them would fill the shared root disk.
# Errors on archive URLs and every other request are still logged.
map "$status:$uri" $tstiles_loggable {
    "~^(200|206|304):/archives/" 0;
    default                       1;
}
