# TSTiles nginx: the public route table of ops/public.caddy, as server-level directives.
#
# Installed as /etc/nginx/snippets/tstiles-routes.conf and included inside the TLS server block of
# ops/nginx/itstiles.com.conf (after `root`). Requires the $tstiles_* maps from tstiles-http.conf in
# http context. test/hosting/nginx.test.mjs loads this file unmodified against real nginx.
# Rollback: remove the site's sites-enabled symlink, `nginx -t`, reload. Static files need no reload.
#
# Served: /archives/<64 hex>.pmtiles, /maps/<id>.json, / and /index.html, /impressum, /datenschutz,
# /nutzungsbedingungen (their .html names 301 to these), /robots.txt, /assets/**, /styles/**.
# Everything else, every dot path, and every directory is 404. OPTIONS is a 204 preflight; methods
# other than GET/HEAD/OPTIONS are 405 with Allow. Range, HEAD, ETag, If-Match, If-None-Match,
# If-Modified-Since and If-Range are nginx's native static-file handling (sendfile, no buffering to
# temp files: nothing here proxies).
#
# add_header does not merge across levels (nginx < 1.29.3 has no add_header_inherit): a location
# with any add_header loses the server-level ones. Every location below therefore repeats the FULL
# set. Change one, change all - the test checks each route.
#
# HTTP compression: gzip is switched off for archives and glyph .pbf; their bytes must reach the
# client unencoded (PMTiles offsets refer to the file). brotli is a third-party module and cannot be
# named here without breaking nginx builds that lack it; itstiles.com.conf turns it off server-wide.

autoindex off;
log_not_found off;
charset utf-8;
charset_types text/css text/javascript text/plain;  # text/html is always included

# Order matches ops/public.caddy: dot paths, then preflight, then unsupported methods.
# $uri is decoded and normalised (%2e, //, /../ resolved) before this test.
if ($uri ~ "(^|/)\.") {
    return 404;
}
if ($request_method = OPTIONS) {
    return 204;
}
if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

# Server-level set: applies to the three returns above and to the final 404 location.
add_header Access-Control-Allow-Origin $tstiles_acao always;
add_header Access-Control-Allow-Methods $tstiles_acam always;
add_header Access-Control-Allow-Headers $tstiles_acah always;
add_header Access-Control-Expose-Headers $tstiles_aceh always;
add_header X-Content-Type-Options $tstiles_nosniff always;
add_header Strict-Transport-Security $tstiles_hsts always;
add_header Access-Control-Max-Age $tstiles_max_age always;
add_header Allow $tstiles_allow always;
add_header Cache-Control "no-store" always;

# Immutable digest archives.
location ~ "^/archives/[a-f0-9]{64}\.pmtiles$" {
    types { }
    default_type application/octet-stream;
    gzip off;
    gzip_static off;
    try_files $uri =404;

    add_header Access-Control-Allow-Origin $tstiles_acao always;
    add_header Access-Control-Allow-Methods $tstiles_acam always;
    add_header Access-Control-Allow-Headers $tstiles_acah always;
    add_header Access-Control-Expose-Headers $tstiles_aceh always;
    add_header X-Content-Type-Options $tstiles_nosniff always;
    add_header Strict-Transport-Security $tstiles_hsts always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Cache-Control $tstiles_error_no_store always;
}

# Mutable manifests: revalidate on every use.
location ~ "^/maps/[a-z0-9][a-z0-9_-]{0,63}\.json$" {
    types { }
    default_type application/json;
    try_files $uri =404;

    add_header Access-Control-Allow-Origin $tstiles_acao always;
    add_header Access-Control-Allow-Methods $tstiles_acam always;
    add_header Access-Control-Allow-Headers $tstiles_acah always;
    add_header Access-Control-Expose-Headers $tstiles_aceh always;
    add_header X-Content-Type-Options $tstiles_nosniff always;
    add_header Strict-Transport-Security $tstiles_hsts always;
    add_header Cache-Control "no-cache";
    add_header Cache-Control $tstiles_error_no_store always;
}

# HTML pages: the landing page at / and /index.html, and the legal pages at clean paths.
# Nothing frames them, so they refuse cross-site framing with CSP frame-ancestors (no
# X-Frame-Options). Referrer-Policy and CSP are success-only (non-always): an error page carries
# neither, and the 416 second header pass cannot duplicate them.
location ~ "^/(index\.html)?$" {
    types { }
    default_type text/html;
    try_files /index.html =404;

    add_header Access-Control-Allow-Origin $tstiles_acao always;
    add_header Access-Control-Allow-Methods $tstiles_acam always;
    add_header Access-Control-Allow-Headers $tstiles_acah always;
    add_header Access-Control-Expose-Headers $tstiles_aceh always;
    add_header X-Content-Type-Options $tstiles_nosniff always;
    add_header Strict-Transport-Security $tstiles_hsts always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "frame-ancestors 'self'";
    add_header Cache-Control "no-cache";
    add_header Cache-Control $tstiles_error_no_store always;
}

location ~ "^/(?<tstiles_page>impressum|datenschutz|nutzungsbedingungen)$" {
    types { }
    default_type text/html;
    try_files /$tstiles_page.html =404;

    add_header Access-Control-Allow-Origin $tstiles_acao always;
    add_header Access-Control-Allow-Methods $tstiles_acam always;
    add_header Access-Control-Allow-Headers $tstiles_acah always;
    add_header Access-Control-Expose-Headers $tstiles_aceh always;
    add_header X-Content-Type-Options $tstiles_nosniff always;
    add_header Strict-Transport-Security $tstiles_hsts always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "frame-ancestors 'self'";
    add_header Cache-Control "no-cache";
    add_header Cache-Control $tstiles_error_no_store always;
}

# One URL per legal page: the file name redirects to the clean path. No add_header here, so the
# server-level set (CORS, nosniff, no-store) applies. Relative Location, as Caddy's redir sends.
location ~ "^/(?<tstiles_page_file>impressum|datenschutz|nutzungsbedingungen)\.html$" {
    absolute_redirect off;
    return 301 /$tstiles_page_file;
}

# robots.txt (optional static file from public/): short lifetime, then revalidate.
location = /robots.txt {
    types { }
    default_type text/plain;
    try_files /robots.txt =404;

    add_header Access-Control-Allow-Origin $tstiles_acao always;
    add_header Access-Control-Allow-Methods $tstiles_acam always;
    add_header Access-Control-Allow-Headers $tstiles_acah always;
    add_header Access-Control-Expose-Headers $tstiles_aceh always;
    add_header X-Content-Type-Options $tstiles_nosniff always;
    add_header Strict-Transport-Security $tstiles_hsts always;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    add_header Cache-Control $tstiles_error_no_store always;
}

# Viewer bundles and style resources (styles, sprites, glyphs): short lifetime, then revalidate.
# `try_files $uri` matches files only, so directories are 404 rather than a 403 index error.
location ^~ /assets/ {
    types {
        text/html               html;
        text/css                css;
        text/javascript         js mjs;
        application/json        json map;
        application/x-protobuf  pbf;
        image/png               png;
        image/webp              webp;
        image/svg+xml           svg;
        font/woff2              woff2;
        application/wasm        wasm;
        text/plain              txt;
    }
    default_type application/octet-stream;
    try_files $uri =404;

    add_header Access-Control-Allow-Origin $tstiles_acao always;
    add_header Access-Control-Allow-Methods $tstiles_acam always;
    add_header Access-Control-Allow-Headers $tstiles_acah always;
    add_header Access-Control-Expose-Headers $tstiles_aceh always;
    add_header X-Content-Type-Options $tstiles_nosniff always;
    add_header Strict-Transport-Security $tstiles_hsts always;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    add_header Cache-Control $tstiles_error_no_store always;
}

location ^~ /styles/ {
    types {
        text/html               html;
        text/css                css;
        text/javascript         js mjs;
        application/json        json map;
        application/x-protobuf  pbf;
        image/png               png;
        image/webp              webp;
        image/svg+xml           svg;
        font/woff2              woff2;
        application/wasm        wasm;
        text/plain              txt;
    }
    default_type application/octet-stream;
    try_files $uri =404;

    add_header Access-Control-Allow-Origin $tstiles_acao always;
    add_header Access-Control-Allow-Methods $tstiles_acam always;
    add_header Access-Control-Allow-Headers $tstiles_acah always;
    add_header Access-Control-Expose-Headers $tstiles_aceh always;
    add_header X-Content-Type-Options $tstiles_nosniff always;
    add_header Strict-Transport-Security $tstiles_hsts always;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    add_header Cache-Control $tstiles_error_no_store always;

    # Glyph PBFs are already-packed protobuf; serve the exact bytes. Inherits headers and types.
    location ~ "\.pbf$" {
        gzip off;
        gzip_static off;
        try_files $uri =404;
    }
}

# Everything else. No add_header here: the server-level set (no-store) applies.
location / {
    return 404;
}
