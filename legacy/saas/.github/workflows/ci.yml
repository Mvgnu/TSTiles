name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Prisma DB Push
        run: npx prisma db push --accept-data-loss --skip-generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Platform Tests
        run: npm run test:platform

      - name: Domain Tests
        run: npm run test:domains

      - name: App Tests
        run: npm run test:app

      - name: Build
        run: npm run build

      - name: Start Demo Server
        run: nohup node dist/app/demo-server.js > /tmp/tileserver-demo.log 2>&1 &

      - name: Wait for Health
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Demo server failed to become healthy"
          cat /tmp/tileserver-demo.log || true
          exit 1

      - name: Smoke E2E
        run: npm run smoke:e2e
